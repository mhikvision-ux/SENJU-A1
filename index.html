<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR F-16</title>
  <!-- โหลด A-Frame และ AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    /* สไตล์ปุ่มกดทับบนกล้อง AR */
    .ui-container {
      position: absolute;
      bottom: 30px;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 10;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      margin: 0 10px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- UI ปุ่มกด -->
  <div class="ui-container">
    <button id="btn-fly">บิน</button>
    <button id="btn-orbit">บินวน</button>
  </div>

  <!-- ฉาก AR -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <!-- แกนหมุนสำหรับบินวน -->
      <a-entity id="orbit-center">
        <!-- ตัวเครื่องบิน F16 -->
        <!-- ต้องเปลี่ยนไฟล์ 'f16.glb' เป็นที่อยู่ไฟล์ 3D ของคุณจริง ๆ -->
        <a-entity id="f16-model"
          gltf-model="url(f16.glb)" 
          scale="0.05 0.05 0.05" 
          position="0 0 0" 
          rotation="0 0 0">
        </a-entity>
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const plane = document.querySelector('#f16-model');
    const orbit = document.querySelector('#orbit-center');

    // ฟังก์ชัน: บิน (ลอยขึ้นลง)
    document.querySelector('#btn-fly').addEventListener('click', () => {
      // ลบแอนิเมชันบินวนทิ้ง
      orbit.removeAttribute('animation');
      orbit.setAttribute('rotation', '0 0 0');
      
      // ตั้งค่าเครื่องบินให้อยู่ตรงกลาง แล้วใส่แอนิเมชันลอยขึ้นลง
      plane.setAttribute('position', '0 0 0');
      plane.setAttribute('animation', 'property: position; to: 0 2 0; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine');
    });

    // ฟังก์ชัน: บินวน
    document.querySelector('#btn-orbit').addEventListener('click', () => {
      // ลบแอนิเมชันลอยขึ้นลงทิ้ง
      plane.removeAttribute('animation');
      
      // ดันเครื่องบินออกจากแกนกลาง (สร้างรัศมี) และปรับหัวเครื่องบิน
      plane.setAttribute('position', '1.5 1 0');
      plane.setAttribute('rotation', '0 90 0'); 
      
      // หมุนแกนกลาง ทำให้เครื่องบินที่อยู่รอบนอกหมุนตาม (บินวน)
      orbit.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear');
    });
  </script>

</body>
</html>
